name: Bug report
description: Report a reproducible problem without private data
title: "Bug: "
body:
  - type: markdown
    attributes:
      value: "Use synthetic examples. Remove credentials, customer information, private URLs, and captured content. Report security issues privately through the repository's Security tab."
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "Package version or commit SHA"
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the smallest synthetic example and relevant configuration.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
